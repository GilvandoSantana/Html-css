<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Prato">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FDF3F6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Meu Prato</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma coluna para iPhone, abas flutuantes embaixo, folha deslizante para escolher alimentos.
   Identidade: rosé e ameixa. Fundo blush, ameixa para ações, rosa vivo só nos números e no progresso. */
:root{
  --bg:#FDF3F6; --bg-glow:#FBE3EB; --surface:#FFFFFF; --surface2:#FCE9EF; --ink:#3A1F2B; --muted:#86616F; --line:#F3D9E2;
  --rind:#8E2457; --on-rind:#FFFFFF; --flesh:#D63B67; --flesh-soft:#FDE4EB;
  --p:#8C6BD8; --c:#F0A23A; --g:#3FB59B; --water:#5BB4E0; --warn:#B4530A;
  --hero-a:#7A1F4B; --hero-b:#C23E73; --on-hero:#FFFFFF;
  --shadow:0 10px 26px rgba(142,36,87,.10);
  --display:'DM Serif Display','Playfair Display',Georgia,serif;
  --body:'Nunito','Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E121A; --bg-glow:#2E1623; --surface:#2A1823; --surface2:#38212F; --ink:#FCEAF1; --muted:#CBA5B6; --line:#4A2F3F;
    --rind:#F48FB1; --on-rind:#2A1220; --flesh:#FF7FA2; --flesh-soft:#4A2231;
    --p:#B7A0F2; --c:#F5BA5C; --g:#5FD0B6; --water:#7CC9F2; --warn:#FFAB66;
    --hero-a:#5A1B3A; --hero-b:#8C2D5A; --shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E121A; --bg-glow:#2E1623; --surface:#2A1823; --surface2:#38212F; --ink:#FCEAF1; --muted:#CBA5B6; --line:#4A2F3F;
  --rind:#F48FB1; --on-rind:#2A1220; --flesh:#FF7FA2; --flesh-soft:#4A2231;
  --p:#B7A0F2; --c:#F5BA5C; --g:#5FD0B6; --water:#7CC9F2; --warn:#FFAB66;
  --hero-a:#5A1B3A; --hero-b:#8C2D5A; --shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);background-image:linear-gradient(180deg,var(--bg-glow) 0,var(--bg) 380px);background-repeat:no-repeat;
  color:var(--ink);font:500 16px/1.5 var(--body);-webkit-text-size-adjust:100%;
  padding-block:6px 128px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.lock{overflow:hidden}
#app{max-width:560px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;color:var(--rind)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--flesh);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none}
.tag{font-size:13px;color:var(--muted);font-weight:700;text-align:right}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.greet{font-size:34px;color:var(--rind);margin:2px 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}

/* cartões e formulários */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;min-width:0}
.card>h2{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
label.f input,label.f select,.inp{width:100%;min-height:52px;padding:10px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font-size:16px;font-weight:700}
label.f input:focus,label.f select:focus,.inp:focus{border-color:var(--flesh);outline:none;box-shadow:0 0 0 4px var(--flesh-soft)}
label.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.hint{font-size:12px;color:var(--warn);font-weight:700}

/* meta */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-hero);border-radius:26px;padding:22px 20px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),rgba(255,255,255,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:inherit;opacity:.85}
.hero .big{font-family:var(--display);font-weight:400;font-size:66px;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.hero .big span{font-family:var(--body);font-size:20px;font-weight:700;margin-left:8px;opacity:.9}
.hero .sub{font-size:14px;opacity:.92}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:18px 0 12px;background:rgba(255,255,255,.2);gap:2px}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{display:flex;flex-direction:column;font-size:12px;font-weight:700}
.legend b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}

/* indicadores */
.gauge{position:relative;max-width:270px;margin:0 auto}
.gauge svg{display:block;width:100%;height:auto}
.gauge .mid{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .mid b{font-family:var(--display);font-weight:400;font-size:44px;color:var(--flesh);font-variant-numeric:tabular-nums;line-height:1}
.gauge .mid div{font-size:13px;color:var(--muted);font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.bar{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:10px;font-size:13px;font-weight:700}
.bar .tr{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.notice{background:var(--flesh-soft);border-radius:18px;padding:14px;margin-top:16px;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:12px}

/* cardápio e diário */
.meal-h{display:flex;gap:10px;align-items:center}
.meal-name{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-weight:400;font-size:23px;padding:4px 0;border-bottom:1.5px dashed transparent}
.meal-name:focus{border-bottom-color:var(--flesh);outline:none}
.meal-time{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;min-height:38px}
.done{font-size:12px;font-weight:800;color:var(--rind);background:var(--flesh-soft);padding:4px 12px;border-radius:999px}
.meal-sum{font-size:13px;color:var(--muted);margin:4px 0 6px;font-weight:600;font-variant-numeric:tabular-nums}
.meal-sum b{color:var(--ink)}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.it-name{font-weight:800;min-width:0;overflow-wrap:anywhere}
.it-k{font-family:var(--display);font-weight:400;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.it-k small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted);margin-left:3px}
.it-ctl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.it-ctl input{width:84px;min-height:44px;padding:6px 12px;text-align:right;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-size:16px;font-weight:800}
.it-ctl input:focus{border-color:var(--flesh);outline:none;box-shadow:0 0 0 3px var(--flesh-soft)}
.it-ctl .u{font-size:13px;color:var(--muted);font-weight:600}
.it-btns{display:flex;gap:8px}
.ib{width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:50%;color:var(--rind)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.big{width:56px;height:56px;font-size:30px;font-weight:700;line-height:1;background:var(--flesh-soft);border-color:transparent}
.meal-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.ckrow{display:flex;gap:14px;align-items:center;width:100%;min-height:60px;padding:10px 12px;margin:3px 0;background:none;border:0;border-radius:18px;text-align:left}
.ckrow[aria-pressed="true"]{background:var(--flesh-soft)}
.box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-rind);background:var(--surface)}
.box svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ckrow[aria-pressed="true"] .box{background:var(--rind);border-color:var(--rind)}
.ckrow[aria-pressed="true"] .box svg{opacity:1}
.ckrow[aria-pressed="true"] .ck-n{color:var(--muted)}
.ck-n{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.ck-n small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.ck-k{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.water,.sweets{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wv{flex:1;text-align:center}
.wv b{font-family:var(--display);font-weight:400;font-size:38px;color:var(--flesh);font-variant-numeric:tabular-nums}
.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.cup{height:48px;border-radius:8px 8px 18px 18px;border:2px solid var(--line);background:var(--surface)}
.cup.on{background:var(--water);border-color:var(--water)}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0}
.dots i{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--flesh);border-color:var(--flesh)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--rind);background:var(--rind);color:var(--on-rind);font-family:var(--body);font-weight:800;font-size:16px;box-shadow:0 8px 18px rgba(142,36,87,.20)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--rind);box-shadow:none}
.btn[disabled]{opacity:.5}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:8px}
.link{background:none;border:0;padding:10px 4px;font-size:14px;font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--flesh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--rind);color:var(--on-rind);border-color:var(--rind)}
.chip[data-today="true"]::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--flesh);margin-left:6px;vertical-align:middle}

/* lista de alimentos e cálculo */
.flist{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}
.sheet .flist{max-height:none;border-top:0}
.fo{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;min-height:56px}
.fo[aria-current="true"]{background:var(--flesh-soft);border-radius:14px}
.fo .n{font-weight:800;overflow-wrap:anywhere}
.fo .d{font-size:12px;color:var(--muted);font-weight:600}
.fo .k{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap;text-align:right;font-weight:700}
.mine{font-size:11px;font-weight:800;color:var(--flesh);margin-left:6px;letter-spacing:.05em}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.res div{display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:var(--surface2);border-radius:16px;min-width:0}
.res b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.res div:first-child b{color:var(--flesh)}
.res span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.navcard{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;min-height:76px;font-size:26px;color:var(--rind)}
.navcard b{font-family:var(--display);font-weight:400;font-size:21px;display:block;color:var(--ink)}
.navcard span span{display:block;font-size:14px;color:var(--muted);font-weight:600;font-family:var(--body)}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.rec{border-top:1px solid var(--line)}
.rec summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 2px;list-style:none;min-height:60px;cursor:pointer}
.rec summary::-webkit-details-marker{display:none}
.shop-h{margin:20px 0 4px;color:var(--rind)}
.hist{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700}
.hist>*{padding:10px 0;border-top:1px solid var(--line)}

/* abas flutuantes */
.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:6px}
.tabs-in{max-width:520px;margin:0 auto;display:flex;gap:2px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;border:0;border-radius:22px;background:none;color:var(--muted);font-size:11px;font-weight:800}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--flesh-soft);color:var(--rind)}

/* folhas e avisos */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(40,12,26,.55)}
.panel{position:relative;background:var(--surface);border-radius:28px 28px 0 0;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  width:100%;max-width:560px;margin:0 auto}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.panel-body{overflow-y:auto;min-height:0;flex:1}
.toast{position:fixed;left:0;right:0;z-index:50;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast[hidden]{display:none}
.toast div{pointer-events:auto;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700;max-width:560px}
.toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;padding:4px}

/* foto da refeição */
.photo-card,.photo-note{display:none}
body .photo-btn{display:none!important}
.photo-yes .photo-card,.photo-no .photo-card{display:block}
.photo-yes .photo-btn{display:flex!important}
.photo-no .photo-note{display:block}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:18px;display:block;margin-bottom:14px}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--flesh);border-radius:50%;margin:16px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:sp 1s linear infinite}
  .bar .tr i,.split i{transition:width .4s ease}
  .gauge path.fill{transition:stroke-dasharray .5s ease}
  .btn,.ckrow,.cup{transition:transform .12s ease,background-color .2s ease}
  .btn:active,.cup:active{transform:scale(.97)}
}
@media (max-width:380px){.hero .big{font-size:56px}.res{grid-template-columns:repeat(2,1fr)}.greet{font-size:30px}}

/* novidades */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2);margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:800;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--rind);color:var(--on-rind)}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phthumb{position:relative;padding:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:3/4}
.phthumb.on{border-color:var(--flesh);box-shadow:0 0 0 3px var(--flesh-soft)}
.phthumb img{width:100%;height:100%;object-fit:cover;display:block}
.phd{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.phb{position:absolute;top:6px;left:6px;background:var(--flesh);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.cmp figcaption{text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
.cmpo{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--surface2)}
.cmpo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmpo img.top{clip-path:inset(0 calc(100% - var(--v)) 0 0)}
.cmpo .cl{position:absolute;top:0;bottom:0;left:var(--v);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.remck{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:700;cursor:pointer}
.remck input{width:24px;height:24px;accent-color:var(--rind);flex:none}
.remrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
#rbanner{position:fixed;z-index:60;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;background:var(--rind);color:var(--on-rind,#fff);padding:14px 16px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#rbanner[hidden]{display:none}
#rbanner>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#rbanner b{font-size:16px}#rbanner span{font-size:13px;opacity:.9}
#rbanner .btn{min-height:40px;padding:6px 14px;background:#fff;color:var(--rind)}
#rbanner .ib{flex:none;color:inherit;background:transparent;border:0}
#rbanner .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.warnc{border:2px solid var(--warn)}
.est-card{display:none}
.photo-yes .est-card{display:block}
.nextc{border:2px solid var(--flesh-soft)}
.nx-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.nx-t{font-weight:800;color:var(--rind)}
.wdots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd i{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.wd i.on{background:var(--flesh);border-color:var(--flesh)}
.wd small{font-size:11px;color:var(--muted);font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .btn{flex:none}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px;font-weight:700}
.weeknav .ib[disabled]{opacity:.35}
.txt{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}

function calcMeta(p){
  const male=p.sexo==='m';
  const tmb=10*p.peso+6.25*p.altura-5*p.idade+(male?5:-161);
  const tdee=tmb*p.ativ;
  let k=p.obj==='perder'?tdee*(1-p.ritmo):p.obj==='ganhar'?tdee*1.1:tdee;
  k=Math.max(male?1500:1200,Math.round(k/10)*10);
  const prot=Math.round(p.peso*(p.obj==='ganhar'?2:1.8));
  let gord=Math.round(p.peso*0.8);
  let carb=Math.round((k-prot*4-gord*9)/4);
  if(carb<100){gord=Math.round(p.peso*0.6);carb=Math.max(0,Math.round((k-prot*4-gord*9)/4))}
  return{tmb:Math.round(tmb),tdee:Math.round(tdee),kcal:k,prot,gord,carb,agua:p.peso*0.03};
}
const mac=(f,g)=>({k:f.k*g/100,p:f.p*g/100,c:f.ch*g/100,g:f.g*g/100});
function sumItems(items){
  const t={k:0,p:0,c:0,g:0};
  items.forEach(it=>{const f=food(it.f);if(!f)return;const m=mac(f,it.g);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.g+=m.g});
  return t;
}
const planTotals=meals=>sumItems(meals.flatMap(m=>m.items));
function scalePlan(meals,factor){
  meals.forEach(m=>m.items.forEach(it=>{
    const f=food(it.f);const step=f&&f.u&&f.u.whole?f.u.g:5;
    it.g=Math.max(step,Math.round(it.g*factor/step)*step);
  }));
}
function buildPlan(target,tpl){
  const meals=(tpl||TEMPLATES[0]).map(m=>({id:uid(),nome:m.nome,hora:m.hora,items:m.it.map(([f,g])=>({id:uid(),f,g}))}));
  scalePlan(meals,target/planTotals(meals).k);
  return meals;
}
function unitText(f,g){
  if(!f||!f.u)return'';
  const n=Math.round(g/f.u.g*2)/2;
  if(n<0.5)return'';
  return'≈ '+fmt(n,n%1?1:0)+' '+(n===1?f.u.s:f.u.pl);
}

const API='https://meuprato-api.gilvando2014.workers.dev';
let TOKEN='',ME=null,syncState='idle',syncTimer=0,syncBusy=false,syncDirty=false,syncLast={},bannerOff=false;

function setTheme(sexo){

  document.documentElement.dataset.sex=s;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=s==='m'?'#F1F6FD':'#FDF3F6';
}
async function api(path,opt){
  opt=opt||{};
  const h={'content-type':'application/json'};
  if(opt.auth!==false&&TOKEN)h.authorization='Bearer '+TOKEN;
  let r;
  try{r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,keepalive:!!opt.keepalive})}
  catch(e){const er=new Error('Sem conexão com o servidor.');er.code='offline';throw er}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const er=new Error(j.erro||'Não foi possível concluir.');er.status=r.status;
    if(r.status===401&&opt.auth!==false&&TOKEN){er.expired=true}
    throw er;
  }
  return j;
}
function splitState(o){
  const core=Object.assign({},o),log=core.log||{};delete core.log;
  const docs={core:JSON.stringify(core)},by={};
  Object.keys(log).forEach(k=>{const m=k.slice(0,7);(by[m]=by[m]||{})[k]=log[k]});
  Object.keys(by).forEach(m=>{docs['log_'+m]=JSON.stringify(by[m])});
  return docs;
}
const SYNC_TXT={ok:'salvo',idle:'',pending:'salvando...',saving:'salvando...',offline:'sem conexão',err:'erro ao salvar'};
function showSync(){
  const t=$('#tag');if(!t)return;
  t.textContent=ME?ME.nome+(SYNC_TXT[syncState]?' · '+SYNC_TXT[syncState]:''):'Calorias e cardápio';
}
function save(keep){
  if(!S||!TOKEN)return;
  S.plans[viewDay]=S.meals;if(!keep)S.updated=Date.now();
  syncDirty=true;if(syncState!=='offline'&&syncState!=='err')syncState='pending';
  clearTimeout(syncTimer);syncTimer=setTimeout(syncPush,900);showSync();
}
async function syncPush(){
  if(!TOKEN||!S)return;
  if(syncBusy){syncDirty=true;return}
  syncBusy=true;syncDirty=false;syncState='saving';showSync();
  let ok=true;
  try{
    const o=Object.assign({},S);delete o.meals;o.plans=S.plans;
    const docs=splitState(o);
    for(const n of Object.keys(docs)){
      if(syncLast[n]===docs[n])continue;
      await api('/api/doc/'+n,{method:'PUT',body:{json:docs[n]}});
      syncLast[n]=docs[n];
    }
    syncState='ok';
  }catch(e){
    ok=false;
    if(e.expired){syncBusy=false;forceLogout('Sua sessão expirou. Entre de novo.');return}
    syncState=e.code==='offline'?'offline':'err';syncDirty=true;
    setTimeout(()=>{if(syncDirty&&!syncBusy)syncPush()},8000);
  }
  syncBusy=false;
  if(ok&&syncDirty){clearTimeout(syncTimer);syncTimer=setTimeout(syncPush,300)}
  showSync();
  if(curTab()==='hoje'&&bannerNeeded())renderHoje();
}
const bannerNeeded=()=>!bannerOff&&(syncState==='offline'||syncState==='err')&&!document.querySelector('.warnc');
function storageNote(){
  if(syncState==='offline')return{ok:false,t:'Sem conexão. Suas alterações estão neste aparelho e serão salvas no servidor quando a internet voltar. Não feche o app até voltar.'};
  if(syncState==='err')return{ok:false,t:'Não consegui salvar no servidor agora. O app vai tentar de novo sozinho. Use o Backup dos dados para ter uma cópia.'};
  return{ok:true,t:'Seus dados ficam salvos no servidor, na sua conta. Se trocar de celular, é só entrar com seu usuário e senha.'};
}
function storageBanner(){
  if(bannerOff||(syncState!=='offline'&&syncState!=='err'))return'';
  return`<section class="card warnc"><p class="small" style="margin:0"><b>Atenção:</b> ${esc(storageNote().t)}</p><button class="link" data-act="bannerx" style="margin-top:8px">Entendi</button></section>`;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&syncDirty&&TOKEN){clearTimeout(syncTimer);syncPush()}else if(!document.hidden&&TOKEN&&(syncState==='offline'||syncState==='err'))syncPush()});
window.addEventListener('online',()=>{if(TOKEN&&syncDirty)syncPush()});
function defaultsFor(sexo){
  const d=defaults();d.profile.sexo=sexo;d.profile.setup=false;
  d.plans=buildWeek(calcMeta(d.profile).kcal);return d;
}
function loadFromDocs(docs){
  syncLast={};
  let c=null;try{c=docs.core?JSON.parse(docs.core):null}catch(e){}
  if(c&&c.profile){
    c.log={};
    Object.keys(docs).filter(n=>n.indexOf('log_')===0).forEach(n=>{try{Object.assign(c.log,JSON.parse(docs[n]))}catch(e){}});
    S=norm0(c);
    if(S.profile.setup===undefined)S.profile.setup=true;
    Object.keys(docs).forEach(n=>{syncLast[n]=docs[n]});
  }else{S=defaultsFor(ME.sexo);syncLast={}}
  S.profile.sexo=ME.sexo;
  viewDay=todayIdx();S.meals=S.plans[viewDay];
}
function appReady(){
  document.body.classList.remove('authing');
  setTheme(ME.sexo);syncState='ok';showSync();
  if(!location.hash||!TABS.includes(location.hash.slice(1)))location.hash='#hoje';
  render();
  syncDirty=true;syncPush();
}
async function boot(){
  TOKEN=tokGet();
  if(!TOKEN){showAuth();return}
  try{
    const st=await api('/api/state');
    ME=st.user;loadFromDocs(st.docs);appReady();
  }catch(e){
    if(e.code==='offline'){showRetry(e.message)}
    else{tokSet('');TOKEN='';showAuth(e.message)}
  }
}
function showRetry(msg){
  document.body.classList.add('authing');
  $('#view').innerHTML=`<section class="card center"><h2>Sem conexão</h2><p class="muted">${esc(msg)} Confira sua internet e tente de novo.</p><button class="btn block" data-act="retryboot" style="margin-top:14px">Tentar de novo</button></section>`;
}
function forceLogout(msg){
  tokSet('');TOKEN='';ME=null;S=null;syncLast={};syncState='idle';
  phList=[];phLoaded=false;phSel=[];phU={};progView='medidas';
  setTheme('f');showAuth(msg);
}

async function doAuth(){
  if(authBusy)return;
  const err=m=>{const e=$('#a-err');if(e){e.textContent=m;e.hidden=!m}};
  const user=($('#a-user').value||'').trim().toLowerCase(),pass=$('#a-pass').value||'';
  if(!user||!pass)return err('Informe usuário e senha.');
  const btn=$('#authgo');authBusy=true;btn.disabled=true;btn.textContent='Aguarde...';err('');
  try{
    let r;
    if(authMode==='criar'){
      const nome=($('#a-nome').value||'').trim();
      if(!nome)throw new Error('Informe seu nome.');
      r=await api('/api/register',{method:'POST',auth:false,body:{username:user,pass,nome,sexo:regSexo}});
    }else r=await api('/api/login',{method:'POST',auth:false,body:{username:user,pass}});
    TOKEN=r.token;tokSet(TOKEN);ME=r.user;
    const st=await api('/api/state');ME=st.user;loadFromDocs(st.docs);
    const useLegacy=authMode==='criar'&&legacy&&$('#a-legacy')&&$('#a-legacy').checked;
    location.hash='#hoje';
    if(useLegacy){
      S=legacy;S.profile.setup=true;S.profile.sexo=ME.sexo;viewDay=todayIdx();S.meals=S.plans[viewDay];
    }
    authBusy=false;appReady();
    if(useLegacy)importLegacyPhotos().then(()=>{wipeLegacy();toast('Dados do aparelho trazidos para a sua conta',false)});
  }catch(e){
    authBusy=false;
    const b=$('#authgo');if(b){b.disabled=false;b.textContent=authMode==='entrar'?'Entrar':'Criar conta'}
    err(e.message||'Não foi possível concluir.');
  }
}
function wipeLegacy(){try{localStorage.removeItem(KEY);localStorage.removeItem('meuprato.visits');localStorage.removeItem('meuprato.fired');localStorage.removeItem('meuprato.code')}catch(e){}try{indexedDB.deleteDatabase('meuprato-fotos')}catch(e){}}
function importLegacyPhotos(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('meuprato-fotos',1);
      r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};
      r.onerror=()=>res();r.onblocked=()=>res();
      r.onsuccess=()=>{
        try{
          const db=r.result;if(!db.objectStoreNames.contains('f')){res();return}
          const q=db.transaction('f').objectStore('f').getAll();
          q.onsuccess=async()=>{for(const f of (q.result||[])){try{await api('/api/photos',{method:'POST',body:{id:f.id,pose:f.pose,d:f.d,u:f.u,t:f.t}})}catch(e){}}res()};
          q.onerror=()=>res();
        }catch(e){res()}
      };
    }catch(e){res()}
  });
}

  authMode='entrar';forceLogout('');
}

let delArm=false;
function acctClick(a,t){
  if(a==='auth-mode'){authMode=t.dataset.m;showAuth('');return true}
  if(a==='auth-sexo'){
    regSexo=t.dataset.s;setTheme(regSexo);
    document.querySelectorAll('.sexbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===regSexo)));return true;
  }
  if(a==='authgo'){doAuth();return true}
  if(a==='finishsetup'){finishSetup();return true}
  if(a==='retryboot'){boot();return true}
  if(a==='logout'){doLogout();return true}
  if(a==='chpass'){
    const e=$('#c-err'),show=m=>{e.textContent=m;e.hidden=!m};
    api('/api/password',{method:'POST',body:{old:$('#c-old').value,new:$('#c-new').value}})
      .then(()=>{toast('Senha alterada',false);renderConta()}).catch(er=>show(er.message));
    return true;
  }
  if(a==='delacct'){
    const e=$('#d-err'),show=m=>{e.textContent=m;e.hidden=!m};
    if(!delArm){delArm=true;t.textContent='Toque de novo para excluir de vez';return true}
    delArm=false;
    api('/api/account',{method:'DELETE',body:{pass:$('#d-pass').value}})
      .then(()=>{tokSet('');TOKEN='';ME=null;S=null;authMode='criar';forceLogout('Conta excluída.')}).catch(er=>{t.textContent='Excluir minha conta';show(er.message)});
    return true;
  }
  return false;
}

let undoSnap=null,toastTimer=0;
function toast(msg,undoable){
  $('#toast-msg').textContent=msg;
  const b=$('#toast-act');b.hidden=!undoable;b.textContent='Desfazer';
  $('#toast').hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{$('#toast').hidden=true},5500);
}
function snapshot(){S.plans[viewDay]=S.meals;undoSnap=JSON.stringify({plans:S.plans,custom:S.custom})}
function undo(){
  if(!undoSnap)return;
  const o=JSON.parse(undoSnap);S.plans=o.plans;S.custom=o.custom;S.meals=S.plans[viewDay];undoSnap=null;save();
  $('#toast').hidden=true;render();
}

function onMetaInput(e){
  const id=e.target.id;if(!id||id.indexOf('f-')!==0)return;
  const p=S.profile,v=e.target.value;
  if(id==='f-nome'){
    const n=v.trim();if(!n)return;ME.nome=n.slice(0,40);showSync();
    clearTimeout(nameTimer);nameTimer=setTimeout(pushProfile,900);return;
  }
  if(id==='f-sexo'){
    ME.sexo=v==='m'?'m':'f';p.sexo=ME.sexo;setTheme(ME.sexo);pushProfile();save();renderMeta();return;
  }
  const lim={peso:[35,250],altura:[120,220],idade:[18,90]};
  if(id==='f-obj'){p.obj=v;$('#ritmoBox').hidden=v!=='perder'}
  else if(id==='f-ativ')p.ativ=parseFloat(v);
  else if(id==='f-ritmo')p.ritmo=parseFloat(v);
  else if(id==='f-treino')p.treinoKcal=parseInt(v,10)||0;
  else{
    const k=id.slice(2),n=num(v);
    if(!lim[k]||!(n>=lim[k][0]&&n<=lim[k][1]))return;
    p[k]=n;if(k==='idade'){p.ageSet=true;const h=$('#ageHint');if(h)h.hidden=true}
  }
  save();updateMeta();
}

/* ---------- aba Cardápio ---------- */
const IC={
  swap:'<svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>'
};
const bar=(label,val,target,color)=>{
  const pct=Math.min(100,target?val/target*100:0);
  return`<div class="bar"><span>${label}</span><div class="tr"><i style="width:${pct.toFixed(1)}%;background:${color}"></i></div><span>${fmt(val)} / ${fmt(target)} g</span></div>`;
};
function renderCard(){
  const days=DIAS.map((d,i)=>`<button class="chip" data-act="day" data-d="${i}" aria-pressed="${i===viewDay}"${i===todayIdx()?' data-today="true"':''}>${d.slice(0,3)}</button>`).join('');
  const meta=calcMeta(S.profile),T=planTotals(S.meals);
  const pct=Math.min(100,T.k/meta.kcal*100);
  const off=Math.abs(T.k-meta.kcal)/meta.kcal>0.08;
  const over=T.k>meta.kcal*1.02;
  const meals=S.meals.map(m=>{
    const t=sumItems(m.items);
    const rows=m.items.map(it=>{
      const f=food(it.f);if(!f)return'';
      const mm=mac(f,it.g),ut=unitText(f,it.g);
      return`<li class="it" data-m="${m.id}" data-i="${it.id}">
        <div class="it-name">${esc(f.n)}</div>
        <div class="it-k">${fmt(mm.k)}<small>kcal</small></div>
        <div class="it-ctl"><input data-act="grams" inputmode="decimal" value="${dv(it.g)}" aria-label="Quantidade de ${esc(f.n)} em gramas"><span class="u">g ${ut?'· '+ut:''}</span></div>
        <div class="it-btns"><button class="ib" data-act="swap" aria-label="Trocar ${esc(f.n)}">${IC.swap}</button><button class="ib" data-act="del" aria-label="Remover ${esc(f.n)}">${IC.del}</button></div>
      </li>`;
    }).join('');
    return`<section class="card" data-m="${m.id}">
      <div class="meal-h"><input class="meal-name" data-act="rename" value="${esc(m.nome)}" aria-label="Nome da refeição"><input class="meal-time" type="time" data-act="time" value="${esc(m.hora)}" aria-label="Horário"></div>

function pickFood(id){
  const f=food(id),c=sheetCtx;if(!f||!c)return;
  if(c.mode==='log'){logOf(dkey(new Date())).extra.push({id:uid(),f:f.id,g:f.u?f.u.g:100});save();closeSheet();toast(f.n+' registrado em Hoje',false);render();return}
  const m=S.meals.find(x=>x.id===c.m);if(!m){closeSheet();return}
  snapshot();
  if(c.mode==='swap'){
    const it=m.items.find(x=>x.id===c.i),old=food(it.f);
    const byProt=(old.c==='prot'||old.c==='lac')&&f.p>=5&&old.p>=5;
    const target=byProt?old.p*it.g/100:old.k*it.g/100;
    const per=byProt?f.p/100:f.k/100;
    const step=f.u&&f.u.whole?f.u.g:5;
    const g=per>0?Math.max(step,Math.round(target/per/step)*step):it.g;
    it.f=f.id;it.g=g;
    toast('Trocado por '+fmt(g)+' g de '+f.n,true);
  }else{
    m.items.push({id:uid(),f:f.id,g:f.u?f.u.g:100});
    toast(f.n+' adicionado a '+m.nome,true);
  }
  save();closeSheet();render();
}

async function estimateFood(){

  if(!nome)return fail('Digite o nome do alimento.');
  if(!sampleFn)return fail('A estimativa precisa do link aberto numa conta do Claude.');
  err.hidden=true;btn.disabled=true;btn.textContent='Estimando...';
  try{
    const r=await sampleFn.json('Você é um assistente de nutrição. Informe valores nutricionais médios por 100 g do alimento: "'+nome+'", como normalmente é consumido (cozido ou pronto). Use a tabela TACO como referência. Responda somente com JSON: {"nome":"nome curto em português","kcal100":0,"p100":0,"c100":0,"g100":0}. Se não for um alimento, responda {"nome":"","kcal100":0,"p100":0,"c100":0,"g100":0}.',{modelTier:'default'});
    const n=v=>{v=Number(v);return isFinite(v)&&v>=0?Math.round(v*10)/10:0};
    const k=n(r&&r.kcal100);

}

const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const dayIdx=d=>(d.getDay()+6)%7;
const todayIdx=()=>dayIdx(new Date());
const planOf=d=>d===viewDay?S.meals:S.plans[d];
const weekKeys=(off=0)=>{const n=new Date(),i=dayIdx(n);return DIAS.map((_,j)=>dkey(new Date(n.getFullYear(),n.getMonth(),n.getDate()-i+j+off*7)))};
const getLog=k=>{const l=S.log[k]||{};return{eaten:l.eaten||{},extra:l.extra||[],water:l.water||0,sweets:l.sweets||0,treino:!!l.treino}};
function logOf(k){
  const l=S.log[k]||(S.log[k]={});
  l.eaten=l.eaten||{};l.extra=l.extra||[];l.water=l.water||0;l.sweets=l.sweets||0;l.treino=!!l.treino;return l;
}
const fdate=k=>{const p=k.split('-');return p[2]+'/'+p[1]};

/* o que foi comido num dia: itens marcados (guardados no momento da marcação) mais os extras */
function eatenItemsOf(key){
  const lg=getLog(key),all=planOf(dayIdx(parseKey(key))).flatMap(m=>m.items),out=[];
  Object.keys(lg.eaten).forEach(id=>{
    const v=lg.eaten[id];if(!v)return;
    if(v.f)out.push({id,f:v.f,g:v.g});
    else{const it=all.find(i=>i.id===id);if(it)out.push(it)}
  });
  return out.concat(lg.extra);
}
function dayGoal(key){
  const m=calcMeta(S.profile),extra=getLog(key).treino?tk():0;
  return{kcal:m.kcal+extra,prot:m.prot,carb:m.carb+Math.round(extra/4),gord:m.gord,extra};
}
function streak(){
  const now=new Date();let n=0;
  for(let i=0;i<90;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    if(dayIdx(d)>=5)continue;
    if(getLog(dkey(d)).treino)n++;
    else if(i>0)break;
  }
  return n;
}

/* ---------- vontade de doce ---------- */
const SWEET_BASE=[
  {n:'Chocolate 70% (2 quadradinhos)',ing:[['choco70',20]]},
  {n:'Brigadeiro (1 unidade)',ing:[['brigadeiro',25]]},
  {n:'Sorvete de creme (1 bola)',ing:[['sorvete',60]]},
  {n:'Maçã com pasta de amendoim',ing:[['maca',130],['pasta',10]]}
];
let craveList=[];
function sweetOptions(){
  const key=dkey(new Date());
  const left=dayGoal(key).kcal-sumItems(eatenItemsOf(key)).k;
  const all=RECIPES.filter(r=>r.tipo==='Doce').map(r=>({n:r.nome,ing:r.ing})).concat(SWEET_BASE).map(o=>{
    const t=sumItems(o.ing.map(([f,g])=>({f,g})));return Object.assign({},o,{k:t.k,p:t.p});
  });
  const fit=all.filter(o=>o.k<=Math.max(left,0)).sort((a,b)=>b.p/b.k-a.p/a.k);
  const rest=all.filter(o=>!fit.includes(o)).sort((a,b)=>a.k-b.k);
  return{left:Math.round(left),list:fit.concat(rest).slice(0,3)};
}
function openInfo(title,html){
  if(photo){if(photo.ctl)photo.ctl.abort();photo=null}
  $('#ptitle').textContent=title;$('#pbody').innerHTML=html;openPhoto();
}
function openCraving(){
  const s=sweetOptions();craveList=s.list;
  const intro=s.left>=150?`Hoje ainda sobram ${fmt(s.left)} kcal. Estas opções cabem na sua meta.`
    :s.left>0?`Hoje sobram só ${fmt(s.left)} kcal. Estas são as menores opções. Vale esperar 15 minutos e beber um copo de água antes.`
    :'A meta de hoje já foi atingida. Estas são as menores opções. Você também pode deixar o doce para um dia com folga.';
  openInfo('Vontade de doce',`<p style="margin-bottom:12px">${intro}</p>`+s.list.map((o,i)=>`<div class="opt"><div><b>${esc(o.n)}</b><span class="small muted">${fmt(o.k)} kcal · ${fmt(o.p,1)} g de proteína</span></div><button class="btn ghost" data-act="crave" data-i="${i}">Comi este</button></div>`).join('')
    +`<button class="btn ghost block" data-act="pclose" style="margin-top:14px">Fechar</button>`);
}
function eatSweet(i){
  const o=craveList[i];if(!o)return;
  const lg=logOf(dkey(new Date()));
  o.ing.forEach(([f,g])=>lg.extra.push({id:uid(),f,g}));lg.sweets+=1;

/* ---------- aba Progresso ---------- */
let progMetric='cintura',progSel=null;
function chartSVG(pts,sel,label){
  const W=320,H=180,L=42,R=16,T=16,B=28;
  const ys=pts.map(p=>p.v);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<1){const m=(hi+lo)/2;lo=m-1;hi=m+1}
  const pd=(hi-lo)*0.2;lo-=pd;hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>t1===t0?L+(W-L-R)/2:L+(t-t0)/(t1-t0)*(W-L-R);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,1)}</text>`).join('');
  const line=pts.length>1?`<polyline points="${pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--rind)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===sel?6:4}" fill="${i===sel?'var(--flesh)':'var(--rind)'}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const hits=pts.map((p,i)=>`<circle data-act="pt" data-i="${i}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="16" fill="transparent" style="cursor:pointer"/>`).join('');
  const xl=`<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fdate(pts[0].d)}</text>`+(pts.length>1?`<text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${fdate(pts[pts.length-1].d)}</text>`:'');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}${line}${dots}${xl}${hits}</svg>`;
}
function renderProg(){
  if(progView==='fotos'){renderFotos();return}
  const unit=progMetric==='peso'?'kg':'cm',nome=progMetric==='peso'?'Peso':'Cintura';
  const pts=S.medidas.filter(x=>x[progMetric]!=null).map(x=>({d:x.d,v:x[progMetric],t:Date.parse(x.d+'T12:00:00')}));
  const sel=progSel!=null&&progSel<pts.length?progSel:pts.length-1;
  let body;
  if(!pts.length)body=`<p class="muted" style="padding:10px 0">Nenhuma medida de ${nome.toLowerCase()} ainda. Registre a primeira acima e o gráfico aparece aqui.</p>`;
  else{
    const a=pts[0],b=pts[pts.length-1],p=pts[sel],df=b.v-a.v;
    body=`${chartSVG(pts,sel,'Gráfico de '+nome.toLowerCase()+' ao longo do tempo')}
    <p class="center" style="font-weight:600">${fdate(p.d)}: ${fmt(p.v,1)} ${unit}</p>
    <p class="center small muted">${pts.length>1?`Do início até agora: ${fmt(a.v,1)} para ${fmt(b.v,1)} ${unit} (${df>0?'+':''}${fmt(df,1)} ${unit})`:'Registre mais uma medida para ver a linha.'}</p>`;
  }
  const last=S.medidas[S.medidas.length-1];
  const next=last?dkey(new Date(Date.parse(last.d+'T12:00:00')+14*864e5)):'';
  const rows=S.medidas.slice().reverse().map(x=>`<span>${fdate(x.d)}</span><span>${x.peso!=null?fmt(x.peso,1)+' kg':'-'}</span><span>${x.cintura!=null?fmt(x.cintura,1)+' cm':'-'}</span><button class="link danger" data-act="delmed" data-d="${x.d}" aria-label="Excluir medida de ${fdate(x.d)}">Excluir</button>`).join('');
  $('#view').innerHTML=progTabs()+`
  <section class="card"><h2>Registrar medidas</h2>
    <div class="grid2">
      <label class="f full">Data<input id="m-data" type="date" value="${dkey(new Date())}"></label>
      <label class="f">Peso (kg)<input id="m-peso" inputmode="decimal" value="${dv(S.profile.peso)}"></label>
      <label class="f">Cintura (cm)<input id="m-cint" inputmode="decimal" placeholder="Ex.: 92"></label>
    </div>
    <p class="small muted" style="margin-top:10px">Meça a cintura na altura do umbigo, de manhã, em jejum. Pese-se 2 a 3 vezes por semana, porque a média da semana é mais confiável que um dia só. Cintura a cada 2 semanas. Ao salvar um peso novo, a meta de calorias é recalculada.</p>
    <p class="hint" id="m-err" hidden style="margin-top:8px"></p>
    <button class="btn block" data-act="savemed" style="margin-top:12px">Salvar medida</button>
  </section>
  <section class="card"><h2>Evolução</h2>
    <div class="chips"><button class="chip" data-act="mtype" data-k="cintura" aria-pressed="${progMetric==='cintura'}">Cintura</button><button class="chip" data-act="mtype" data-k="peso" aria-pressed="${progMetric==='peso'}">Peso</button></div>
    ${body}
    ${progMetric==='peso'?avgPeso():''}
    ${next?`<p class="small muted center" style="margin-top:8px">Próxima medida sugerida: ${fdate(next)}</p>`:''}
  </section>
  ${S.medidas.length?`<section class="card"><h2>Histórico</h2><div class="hist">${rows}</div></section>`:''}`;
}
function avgPeso(){
  const ps=S.medidas.filter(x=>x.peso!=null);if(!ps.length)return'';
  const end=Date.parse(ps[ps.length-1].d+'T12:00:00'),win=ps.filter(x=>Date.parse(x.d+'T12:00:00')>end-7*864e5);
  const avg=win.reduce((s,x)=>s+x.peso,0)/win.length;
  return`<p class="center small" style="margin-top:6px"><b>Peso médio dos últimos 7 dias: ${fmt(avg,1)} kg</b> (${win.length} ${win.length===1?'pesagem':'pesagens'})</p>`;
}
function saveMed(){
  const err=$('#m-err'),d=$('#m-data').value||dkey(new Date());
  const rp=$('#m-peso').value.trim(),rc=$('#m-cint').value.trim();
  const p=num(rp),c=num(rc),okP=p>=35&&p<=250,okC=c>=40&&c<=200;
  const fail=t=>{err.textContent=t;err.hidden=false};
  if(!rp&&!rc)return fail('Informe o peso ou a cintura.');
  if((rp&&!okP)||(rc&&!okC))return fail('Confira os valores. Peso entre 35 e 250 kg, cintura entre 40 e 200 cm.');
  let e=S.medidas.find(x=>x.d===d);
  if(!e){e={d};S.medidas.push(e)}
  if(okP)e.peso=p;
  if(okC)e.cintura=c;
  S.medidas.sort((a,b)=>a.d<b.d?-1:1);
  let msg='Medida salva';
  const lastP=S.medidas.filter(x=>x.peso!=null).pop();
  if(okP&&lastP&&lastP.d===d&&S.profile.peso!==p){S.profile.peso=p;msg='Medida salva. Meta recalculada: '+fmt(calcMeta(S.profile).kcal)+' kcal'}
  save();progSel=null;renderProg();toast(msg,false);
}

function shopEntries(){
  const tot={};
  for(let d=0;d<7;d++)planOf(d).forEach(m=>m.items.forEach(i=>{tot[i.f]=(tot[i.f]||0)+i.g}));
  return Object.keys(tot).map(id=>{
    const f=food(id);if(!f)return null;
    const g=tot[id],buy=BUY[id];
    const main=buy?'≈ '+fmt(Math.ceil(g*buy/10)*10)+' g cru':fmt(Math.round(g/5)*5)+' g';
    const ut=unitText(f,g);
    const sub=buy?'pronto: '+fmt(Math.round(g/5)*5)+' g':ut;
    return{id,f,main,sub};
  }).filter(Boolean).sort((a,b)=>a.f.n.localeCompare(b.f.n,'pt-BR'));
}

/* ---------- ações das novas telas ---------- */
function featureClick(a,t){
  if(photoClick(a,t))return true;
  if(weekClickHandlers(a,t))return true;
  const key=dkey(new Date());
  if(a==='day'){S.plans[viewDay]=S.meals;viewDay=+t.dataset.d;S.meals=S.plans[viewDay];renderCard();return true}
  if(a==='fitall'){
    snapshot();const meta=calcMeta(S.profile);
    S.plans[viewDay]=S.meals;
    S.plans.forEach(p=>{const k=planTotals(p).k;if(k)scalePlan(p,meta.kcal/k)});
    S.meals=S.plans[viewDay];save();toast('Semana ajustada para '+fmt(meta.kcal)+' kcal por dia',true);go('cardapio');return true;
  }
  if(a==='eat'){const lg=logOf(key),id=t.dataset.ii;if(lg.eaten[id])delete lg.eaten[id];else{const it=planOf(todayIdx()).flatMap(m=>m.items).find(i=>i.id===id);if(it)lg.eaten[id]={f:it.f,g:it.g}}save();renderHoje();return true}
  if(a==='eatmeal'){
    const lg=logOf(key),m=planOf(todayIdx()).find(x=>x.id===t.dataset.m);if(!m)return true;
    const all=m.items.every(i=>lg.eaten[i.id]);
    m.items.forEach(i=>{if(all)delete lg.eaten[i.id];else lg.eaten[i.id]={f:i.f,g:i.g}});save();renderHoje();return true;
  }
  if(a==='logadd'){openSheet({mode:'log'});return true}
  if(a==='delextra'){const lg=logOf(key);lg.extra=lg.extra.filter(x=>x.id!==t.dataset.x);save();renderHoje();return true}
  if(a==='cup'){const lg=logOf(key),n=+t.dataset.n;lg.water=lg.water===n?n-1:n;save();renderHoje();return true}
  if(a==='water+'||a==='water-'){const lg=logOf(key);lg.water=Math.max(0,Math.min(30,lg.water+(a==='water+'?1:-1)));save();renderHoje();return true}
  if(a==='sweet+'||a==='sweet-'){const lg=logOf(key);lg.sweets=Math.max(0,Math.min(20,lg.sweets+(a==='sweet+'?1:-1)));save();renderHoje();return true}
  if(a==='bannerx'){bannerOff=true;renderHoje();return true}
  if(a==='estimate'){estimateFood();return true}
  if(a==='mtype'){progMetric=t.dataset.k;progSel=null;renderProg();return true}
  if(a==='pt'){progSel=+t.dataset.i;renderProg();return true}
  if(a==='savemed'){saveMed();return true}
  if(a==='delmed'){S.medidas=S.medidas.filter(x=>x.d!==t.dataset.d);save();renderProg();toast('Medida excluída',false);return true}
  if(a==='shop'){const id=t.dataset.food;if(S.shop[id])delete S.shop[id];else S.shop[id]=true;save();renderShop();return true}
  if(a==='shopclear'){S.shop={};save();renderShop();return true}
  if(a==='shopcopy'){copyShop();return true}
  if(a==='recadd'){addRecipe(t.dataset.r);return true}
  if(a==='logcalc'){
    const f=calcSel&&food(calcSel.id);
    if(!f||!(calcSel.g>0)){toast('Informe a quantidade',false);return true}
    logOf(key).extra.push({id:uid(),f:f.id,g:calcSel.g});save();toast(f.n+' registrado em Hoje',false);return true;

/* ---------- Resumo da semana ---------- */
let weekOff=0,weekDl=null;
function weekStats(off){
  const keys=weekKeys(off),today=dkey(new Date());
  const days=keys.map((k,i)=>{
    const lg=getLog(k),T=sumItems(eatenItemsOf(k)),g=dayGoal(k);
    return{k,i,kcal:T.k,goal:g.kcal,water:lg.water,sweets:lg.sweets,treino:lg.treino,logged:T.k>0,future:k>today};
  });
  const lg=days.filter(d=>d.logged);
  const ok=lg.filter(d=>d.kcal>=d.goal*0.9&&d.kcal<=d.goal*1.05).length;
  const avg=lg.length?lg.reduce((s,d)=>s+d.kcal,0)/lg.length:0;
  const meta=calcMeta(S.profile),cups=Math.max(1,Math.ceil(meta.agua/0.25));
  const waterAvg=lg.length?lg.reduce((s,d)=>s+d.water,0)/lg.length:0;
  const ws=S.medidas.filter(x=>x.peso!=null&&x.d<=keys[6]).pop();
  return{keys,days,lg:lg.length,ok,avg,cups,waterAvg,treinos:days.filter(d=>d.treino).length,
    sweets:days.reduce((s,d)=>s+d.sweets,0),peso:ws?ws.peso:null,pesoD:ws?ws.d:null};
}
function weekText(off){
  const s=weekStats(off);
  const L=['Resumo da semana '+fdate(s.keys[0])+' a '+fdate(s.keys[6]),''];
  if(!s.lg)L.push('Nenhum dia registrado.');
  else{
    L.push('Dias registrados: '+s.lg+' de 7');
    L.push('Média: '+fmt(s.avg)+' kcal por dia');
    L.push('Dias dentro da meta: '+s.ok+' de '+s.lg);
    L.push('Água: média de '+fmt(s.waterAvg,1)+' de '+s.cups+' copos');
  }
  L.push('Treinos: '+s.treinos);
  L.push('Doces: '+s.sweets+' (meta '+SWEET_GOAL+')');
  if(s.peso!=null)L.push('Último peso: '+fmt(s.peso,1)+' kg ('+fdate(s.pesoD)+')');
  return L.join('\n');
}
function weekChart(s){
  const W=320,H=170,L=34,R=10,T=14,B=26,top=Math.max(...s.days.map(d=>Math.max(d.kcal,d.goal)))*1.1;
  const Y=v=>T+(1-v/top)*(H-T-B),bw=(W-L-R)/7;
  const bars=s.days.map((d,i)=>{
    const x=L+i*bw+bw*0.18,w=bw*0.64,h=Math.max(0,H-B-Y(d.kcal));
    const fill=d.kcal>d.goal*1.05?'var(--warn)':'var(--flesh)';
    return(d.kcal>0?`<rect x="${x.toFixed(1)}" y="${Y(d.kcal).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${fill}"/>`:'')
      +`<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${DIAS[i][0]}</text>`;
  }).join('');
  const g=s.days[0].goal;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorias comidas por dia, com a linha da meta"><line x1="${L}" x2="${W-R}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="var(--rind)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L-4}" y="${(Y(g)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">meta</text>${bars}</svg>`;
}
function renderSemana(){

    ${s.lg?weekChart(s):'<p class="muted center" style="padding:14px 0">Nenhum dia registrado nesta semana. Marque o que comeu na aba Hoje.</p>'}
    <div class="res" style="margin-top:12px">${stat(s.lg?fmt(s.avg):'-','kcal por dia')}${stat(s.ok+' de '+s.lg,'na meta')}${stat(s.lg?fmt(s.waterAvg,1):'-','copos por dia')}${stat(s.treinos,'treinos')}</div>
    <p class="center small muted" style="margin-top:10px">Doces: ${s.sweets} (meta ${SWEET_GOAL})${s.peso!=null?' · Último peso: '+fmt(s.peso,1)+' kg':''}</p>

}

const REM_DEF={meals:true,before:0,sound:true,tone:'sino',notif:false,water:{on:false,every:2},treino:{on:false,hora:'17:30'},custom:[]};

const hm=h=>{const p=String(h||'').split(':');return(+p[0]||0)*60+(+p[1]||0)};
const hmFmt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
let audioCtx=null;
function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
const TONES={
  sino:{n:'Sino',seq:[[880,0,.35],[1175,.4,.55]],type:'sine'},
  suave:{n:'Suave',seq:[[523,0,.3],[659,.35,.3],[784,.7,.5]],type:'sine'},
  alerta:{n:'Alerta',seq:[[1000,0,.15],[1000,.25,.15],[1000,.5,.15]],type:'square'}
};
function playTone(name,times){
  try{
    unlockAudio();if(!audioCtx)return;
    const t=TONES[name]||TONES.sino,n=times||2;
    for(let k=0;k<n;k++)t.seq.forEach(([f,at,d])=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t0=audioCtx.currentTime+k*1.6+at;
      o.type=t.type;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(t.type==='square'?0.12:0.35,t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.start(t0);o.stop(t0+d+0.05);
    });
  }catch(e){}
}
let swReg=null;
function initSW(){
  try{
    if(!SA||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;

}
const notifSupported=()=>typeof Notification!=='undefined';

function remEvents(now){
  const r=remCfg(),key=dkey(now),lg=getLog(key),ev=[];
  if(r.meals)planOf(dayIdx(now)).forEach(m=>{
    if(!m.items.length)return;
    const t=sumItems(m.items),names=m.items.slice(0,3).map(i=>{const f=food(i.f);return f?f.n:''}).filter(Boolean).join(', ');
    ev.push({id:'m'+m.id,at:hm(m.hora),before:r.before,title:'Hora do '+String(m.nome).toLowerCase(),body:fmt(t.k)+' kcal · '+names,meal:m,done:m.items.every(i=>lg.eaten[i.id])});
  });
  if(r.water.on){
    const cups=Math.max(1,Math.ceil(calcMeta(S.profile).agua/0.25)),ev0=Math.max(1,+r.water.every||2);
    for(let m=8*60;m<=20*60;m+=ev0*60)ev.push({id:'w'+m,at:m,before:0,title:'Hora de beber água',body:'Beba um copo agora. Meta de hoje: '+cups+' copos.',done:lg.water>=cups});
  }
  if(r.treino.on&&dayIdx(now)<5)ev.push({id:'t',at:hm(r.treino.hora),before:0,title:'Hora do treino',body:'Bom treino! Depois marque em Hoje.',done:lg.treino});
  r.custom.forEach(c=>ev.push({id:'c'+c.id,at:hm(c.hora),before:0,title:c.nome,body:'Lembrete',done:false}));

}

/* calendário (.ics) para avisar com o app fechado */
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function buildICS(){
  const r=remCfg(),today=new Date(),stamp=dkey(today).replace(/-/g,''),BY=['MO','TU','WE','TH','FR','SA','SU'];
  const ev=[],ymd=stamp,mk=(title,mins,by,before)=>{
    const s=ymd+'T'+pad(Math.floor(mins/60))+pad(mins%60)+'00',e=mins+10,en=ymd+'T'+pad(Math.floor(e/60)%24)+pad(e%60)+'00';
    ev.push(['BEGIN:VEVENT','UID:meuprato-'+Math.random().toString(36).slice(2)+'@meuprato','DTSTAMP:'+ymd+'T000000Z','DTSTART:'+s,'DTEND:'+en,
      'RRULE:FREQ=WEEKLY;BYDAY='+by.join(','),'SUMMARY:'+icsEsc(title),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT'+(before||0)+'M','END:VALARM','END:VEVENT'].join('\r\n'));
  };
  const groups={};
  for(let d=0;d<7;d++)planOf(d).forEach(m=>{if(!m.items.length)return;const k=m.nome+'|'+m.hora;(groups[k]=groups[k]||{nome:m.nome,hora:m.hora,days:[]}).days.push(BY[d])});
  if(r.meals)Object.values(groups).forEach(g=>mk('Hora do '+g.nome.toLowerCase(),hm(g.hora),g.days,r.before));
  if(r.water.on)for(let m=8*60;m<=20*60;m+=Math.max(1,+r.water.every||2)*60)mk('Beber água',m,BY,0);
  if(r.treino.on)mk('Treino',hm(r.treino.hora),BY.slice(0,5),0);
  r.custom.forEach(c=>mk(c.nome,hm(c.hora),BY,0));
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meu Prato//PT','CALSCALE:GREGORIAN'].concat(ev).concat(['END:VCALENDAR']).join('\r\n')+'\r\n';
}

/* ---------- divisão das calorias por refeição e ajuste automático ---------- */
const GRP={carb:'c',fruta:'c',doce:'c',prot:'p',lac:'p',veg:'v',gord:'g',fora:'o',meu:'o'};
const stepOf=f=>f&&f.u&&f.u.whole?f.u.g:5;
function shares(meals){
  const ks=meals.map(m=>sumItems(m.items).k),T=ks.reduce((a,b)=>a+b,0);
  const raw=ks.map(k=>T?k/T*100:100/meals.length);
  const fl=raw.map(Math.floor);let rest=100-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{if(rest>0){fl[i]++;rest--}});
  return fl;
}
function curPcts(meals){
  if(meals.length&&meals.every(m=>Number.isInteger(m.pct))&&meals.reduce((a,m)=>a+m.pct,0)===100)return meals.map(m=>m.pct);
  return shares(meals);
}
function applySplit(meals,pcts){
  const kcal=calcMeta(S.profile).kcal;
  meals.forEach((m,i)=>{
    m.pct=pcts[i];
    const k=sumItems(m.items).k,target=kcal*pcts[i]/100;
    if(k>0&&m.items.length)scalePlan([m],target/k);
  });
}
function setMealPct(idx,val){
  const meals=S.meals,n=meals.length;if(n<2)return;
  const p=curPcts(meals);
  val=Math.round(Math.max(5,Math.min(100-5*(n-1),val)));
  const others=p.reduce((a,v,i)=>i===idx?a:a+v,0),room=100-val,out=p.slice();out[idx]=val;
  let sum=val;
  p.forEach((v,i)=>{if(i===idx)return;out[i]=Math.max(5,Math.round(others?v/others*room:room/(n-1)));sum+=out[i]});
  let d=100-sum;
  for(let i=0;d!==0&&i<n*4;i++){const j=i%n;if(j===idx)continue;if(d>0){out[j]++;d--}else if(out[j]>5){out[j]--;d++}}
  applySplit(meals,out);
}
let splitDay=null;

      <span class="sp-c"><button class="ib" data-act="pct-" data-i="${i}" aria-label="Diminuir ${esc(m.nome)}">−</button><label class="sp-v"><input data-act="pctin" data-i="${i}" inputmode="numeric" value="${p[i]}" aria-label="Porcentagem de ${esc(m.nome)}">%</label><button class="ib" data-act="pct+" data-i="${i}" aria-label="Aumentar ${esc(m.nome)}">+</button></span></li>`).join('')}</ul>
    <p class="small" style="margin-top:8px"><b>Total: 100%</b> · ${fmt(kcal)} kcal</p>

/* ao mudar a quantidade de um alimento, compensa nos outros da mesma refeição para manter as calorias */
function shiftKcal(items,delta,lo){
  const c=items.filter(i=>{const f=food(i.f);return f&&f.k>1});
  const W=c.reduce((a,i)=>a+food(i.f).k*i.g/100,0);if(!W)return delta;
  let left=delta;
  c.forEach(i=>{
    const f=food(i.f),kd=f.k/100,step=stepOf(f),w=f.k*i.g/100/W;
    let ng=i.g+delta*w/kd;
    ng=Math.min(i.g*1.5,Math.max(step,(i._o||i.g)*lo,Math.round(ng/step)*step));ng=Math.max(step,Math.round(ng/step)*step);
    left-=(ng-i.g)*kd;i.g=ng;
  });
  return left;
}
function compensate(m,it,before){
  const f0=food(it.f),others=m.items.filter(x=>x.id!==it.id);
  if(!f0||!others.length)return[];
  const snap=new Map(m.items.map(x=>[x.id,x.g]));
  others.forEach(x=>{x._o=x.g});
  let diff=before-sumItems(m.items).k;
  const g0=GRP[f0.c]||'o';
  [[others.filter(x=>(food(x.f)||{}).c===f0.c),0.3],[others.filter(x=>GRP[(food(x.f)||{}).c]===g0),0.4],[others.filter(x=>!['veg','gord'].includes((food(x.f)||{}).c)),0.7]].forEach(([set,lo])=>{
    if(Math.abs(diff)<8||!set.length)return;
    shiftKcal(set,diff,lo);diff=before-sumItems(m.items).k;
  });
  others.forEach(x=>{delete x._o});
  return others.filter(x=>x.g!==snap.get(x.id)).map(x=>(food(x.f)||{}).n).filter(Boolean);
}

function toJpeg(file,max=1280){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

  return'Você é um assistente de nutrição. A imagem mostra uma refeição ou um alimento. '
   +'Identifique cada alimento visível e estime a quantidade em gramas, no peso pronto para comer, pelo tamanho da porção em relação ao prato e aos talheres. '
   +'Se o alimento existir nesta lista, use o id da lista: '+list+'. '
   +'Se não existir, use "id": null e informe os valores aproximados por 100 g (kcal100, p100 proteína, c100 carboidrato, g100 gordura). '
   +'Inclua óleo, molho ou queijo apenas se forem visíveis. No máximo 10 itens. '
   +'Responda somente com JSON neste formato: {"itens":[{"id":"arroz","nome":"Arroz branco","g":120,"kcal100":0,"p100":0,"c100":0,"g100":0}],"obs":"frase curta sobre incertezas, opcional"}. '
   +'Se a imagem não mostrar comida, responda {"itens":[],"obs":"motivo"}.';
}
const perOf=it=>{const f=it.id&&food(it.id);return f?{k:f.k,p:f.p,c:f.ch,g:f.g}:it.per};
function parsePhoto(r){
  const arr=Array.isArray(r)?r:(r&&Array.isArray(r.itens)?r.itens:[]);
  const items=arr.slice(0,10).map(x=>{
    if(!x||typeof x!=='object')return null;
    const id=typeof x.id==='string'&&food(x.id)?x.id:null;
    let g=num(x.g);if(!(g>0))g=100;g=Math.min(3000,Math.round(g/5)*5||5);
    const n0=v=>{v=Number(v);return isFinite(v)&&v>0?v:0};
    const per={k:n0(x.kcal100),p:n0(x.p100),c:n0(x.c100),g:n0(x.g100)};
    if(!(per.k>0))per.k=4*per.p+4*per.c+9*per.g;
    per.k=Math.min(per.k,900);
    return{id,nome:String(x.nome||(id&&food(id).n)||'Alimento').slice(0,60),g,per};
  }).filter(Boolean);
  return{items,obs:r&&typeof r.obs==='string'?r.obs.slice(0,200):''};
}
function openPhoto(){$('#psheet').hidden=false;document.body.classList.add('lock')}
function closePhoto(){
  if(photo&&photo.ctl)photo.ctl.abort();
  if(photo&&photo.thumb)URL.revokeObjectURL(photo.thumb);
  photo=null;$('#psheet').hidden=true;document.body.classList.remove('lock');
}
const PHOTO_ERR={
  not_granted:'Para analisar a foto, permita que o app use o Claude quando o aviso aparecer.',
  sampling_disabled:'O Claude não está disponível nesta conta.',
  session_expired:'Entre de novo na sua conta do Claude e tente outra vez.',
  rate_limited:'Muitas análises seguidas ou limite de uso do Claude atingido. Tente mais tarde.',
  image_rejected:'Não consegui ler essa foto. Tente outra.',
  refused:'Não foi possível analisar essa foto. Tente outra.',
  invalid_json:'Não consegui entender a foto. Tente outra, mais perto do prato.',
  empty_completion:'Não consegui entender a foto. Tente outra, mais perto do prato.'
};
async function photoStart(file){
  if(!sampleFn)return;
  if(photo)closePhoto();
  const me=photo={ctl:new AbortController(),state:'load',items:[],obs:'',thumb:null,err:''};
  openPhoto();drawPhoto();
  try{
    const blob=await toJpeg(file);
    if(photo!==me)return;
    me.thumb=URL.createObjectURL(blob);drawPhoto();
    const r=await sampleFn.json(photoPrompt(),{images:[blob],modelTier:'default',signal:me.ctl.signal});
    if(photo!==me)return;
    const p=parsePhoto(r);me.items=p.items;me.obs=p.obs;me.state='ok';
  }catch(e){
    if(photo!==me||(e&&e.code==='cancelled'))return;
    me.state='err';
    me.err=PHOTO_ERR[e&&e.code]||(e&&e.code?'Não foi possível analisar agora. Tente de novo.':'Não consegui abrir essa foto. Tente outra.');
    if(e&&PHOTO_HIDE.includes(e.code))setPhoto(false);
  }
  drawPhoto();
}
function drawPhoto(){
  const el=$('#pbody');if(!el||!photo)return;
  const thumb=photo.thumb?`<img class="thumb" src="${photo.thumb}" alt="Foto da refeição">`:'';
  if(photo.state==='load'){
    el.innerHTML=`${thumb}<div class="spin" role="status" aria-label="Analisando"></div><p class="center">Analisando a foto. Pode levar até 1 minuto.</p>
      <button class="btn ghost block" data-act="pclose" style="margin-top:14px">Cancelar</button>`;return;
  }
  if(photo.state==='err'){
    el.innerHTML=`${thumb}<p style="margin:6px 0 14px">${esc(photo.err)}</p>
      <button class="btn block" data-act="photo">Escolher outra foto</button>
      <button class="btn ghost block" data-act="pclose" style="margin-top:10px">Fechar</button>`;return;
  }
  const tot={k:0,p:0,c:0,g:0};
  photo.items.forEach(it=>{const p=perOf(it),r=it.g/100;tot.k+=p.k*r;tot.p+=p.p*r;tot.c+=p.c*r;tot.g+=p.g*r});
  const rows=photo.items.map((it,i)=>{
    const p=perOf(it),f=it.id&&food(it.id),ut=f?unitText(f,it.g):'';
    return`<li class="it" data-p="${i}"><div class="it-name">${esc(f?f.n:it.nome)}${f?'':'<span class="mine">ESTIMADO</span>'}</div><div class="it-k">${fmt(p.k*it.g/100)}<small>kcal</small></div>
      <div class="it-ctl"><input data-act="pgrams" inputmode="decimal" value="${dv(it.g)}" aria-label="Quantidade de ${esc(it.nome)} em gramas"><span class="u">g${ut?' · '+ut:''}</span></div>
      <div class="it-btns"><button class="ib" data-act="pdel" data-p="${i}" aria-label="Remover ${esc(it.nome)}">${IC.del}</button></div></li>`;
  }).join('');
  el.innerHTML=`${thumb}
    ${photo.items.length?`<ul class="items">${rows}</ul>
    <div class="res"><div><b>${fmt(tot.k)}</b><span>kcal</span></div><div><b>${fmt(tot.p,1)}</b><span>Prot. g</span></div><div><b>${fmt(tot.c,1)}</b><span>Carb. g</span></div><div><b>${fmt(tot.g,1)}</b><span>Gord. g</span></div></div>`
    :`<p style="margin:6px 0 14px">Não encontrei alimentos nessa foto.${photo.obs?' '+esc(photo.obs):''}</p>`}
    ${photo.items.length&&photo.obs?`<p class="small muted">${esc(photo.obs)}</p>`:''}
    ${photo.items.length?`<p class="small muted" style="margin:8px 0 12px">Estimativa feita pela foto. Corrija as quantidades se precisar, principalmente óleo, molhos e pratos fundos.</p>
    <button class="btn block" data-act="pregister">Registrar em Hoje</button>`:`<button class="btn block" data-act="photo">Escolher outra foto</button>`}
    <button class="btn ghost block" data-act="pclose" style="margin-top:10px">Fechar</button>`;
}
function registerPhoto(){
  if(!photo||!photo.items.length)return;
  const lg=logOf(dkey(new Date()));
  photo.items.forEach(it=>{
    let id=it.id&&food(it.id)?it.id:null;
    if(!id){
      const ex=S.custom.find(f=>norm(f.n)===norm(it.nome));
      if(ex)id=ex.id;
      else{
        const r1=v=>Math.round(v*10)/10,p=it.per;
        const f={id:'c_'+uid(),n:it.nome,c:'meu',k:r1(p.k),p:r1(p.p),ch:r1(p.c),g:r1(p.g),u:null};
        S.custom.push(f);id=f.id;
      }
    }
    lg.extra.push({id:uid(),f:id,g:it.g});
  });
  save();closePhoto();toast('Refeição registrada em Hoje',false);go('hoje');
}
function photoClick(a,t){
  if(a==='photo'){if(sampleFn)$('#photoIn').click();return true}
  if(a==='pclose'){closePhoto();return true}
  if(a==='pdel'){if(photo){photo.items.splice(+t.dataset.p,1);drawPhoto()}return true}
  if(a==='pregister'){registerPhoto();return true}
  return false;
}
function photoChange(t,a){
  if(a!=='pgrams')return false;
  const li=t.closest('[data-p]'),it=photo&&li&&photo.items[+li.dataset.p],n=num(t.value);
  if(it&&n>0&&n<=3000)it.g=Math.round(n*10)/10;
  drawPhoto();return true;
}

/* ---------- navegação e eventos ---------- */
const TABS=['hoje','cardapio','calcular','progresso','mais','meta','compras','receitas','semana','backup','lembretes','conta'];
const TABOF={meta:'mais',compras:'mais',receitas:'mais',semana:'mais',backup:'mais',lembretes:'mais',conta:'mais'};
const curTab=()=>{const h=location.hash.slice(1);return TABS.includes(h)?h:'hoje'};
function render(){
  if(!S||!ME)return;
  let t=curTab();
  if(S.profile.setup===false&&t!=='meta'){location.hash='#meta';return}
  if(S.profile.setup!==false)document.body.classList.remove('setup');
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===(TABOF[t]||t)?'page':'false'));
  ({hoje:renderHoje,cardapio:renderCard,calcular:renderCalc,progresso:renderProg,mais:renderMais,meta:renderMeta,compras:renderShop,receitas:renderRec,semana:renderSemana,backup:renderBackup,lembretes:renderLembretes,conta:renderConta})[t]();
}
function go(t){
  if(location.hash==='#'+t){render();window.scrollTo(0,0)}else location.hash='#'+t;
}
window.addEventListener('hashchange',()=>{closeSheet();render();window.scrollTo(0,0)});
function go2(t){if(S&&ME)go(t)}

document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){go(tabBtn.dataset.tab);return}
  if(e.target.closest('#toast-act')){undo();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(acctClick(a,t))return;
  if(splitClick(a,t))return;
  if(featureClick(a,t))return;
  if(a==='closesheet'){closeSheet();return}
  if(a==='cat'){
    if(t.closest('#sheet')){sheetCat=t.dataset.cat;refreshSheet()}else{calcCat=t.dataset.cat;refreshCalcList()}
    return;
  }
  if(a==='pick'){
    if(sheetCtx){pickFood(t.dataset.food);return}
    const f=food(t.dataset.food);if(!f)return;
    calcSel={id:f.id,g:f.u?f.u.g:100};refreshCalcList();drawDetail();
    $('#calc-detail').scrollIntoView({block:'start'});
    return;
  }
  if(a==='swap'){
    const{m,it}=findItem(t);if(!it)return;
    openSheet({mode:'swap',m:m.id,i:it.id,exclude:it.f,cat:(food(it.f)||{}).c||''});return;
  }
  if(a==='del'){
    const{m,it}=findItem(t);if(!it)return;
    const f=food(it.f);snapshot();m.items=m.items.filter(x=>x.id!==it.id);save();render();
    toast('Removido: '+(f?f.n:'alimento'),true);return;
  }
  if(a==='add'){openSheet({mode:'add',m:t.dataset.m});return}
  if(a==='delmeal'){
    const m=S.meals.find(x=>x.id===t.dataset.m);if(!m)return;
    snapshot();S.meals=S.meals.filter(x=>x.id!==m.id);save();render();toast('Removido: '+m.nome,true);return;
  }
  if(a==='addmeal'){
    snapshot();S.meals.push({id:uid(),nome:'Nova refeição',hora:'15:00',items:[]});save();render();
    toast('Refeição adicionada',true);return;
  }
  if(a==='resetplan'){
    snapshot();S.meals=buildPlan(calcMeta(S.profile).kcal);save();render();toast('Cardápio sugerido restaurado',true);return;
  }
  if(a==='fitplan'){fitPlan();if(curTab()==='meta')go('cardapio');return}
  if(a==='savefood'){saveFood();return}
  if(a==='delfood'){
    const id=t.dataset.food,f=food(id);snapshot();
    S.custom=S.custom.filter(x=>x.id!==id);S.meals.forEach(m=>{m.items=m.items.filter(i=>i.f!==id)});
    if(calcSel&&calcSel.id===id)calcSel=null;save();renderCalc();toast('Excluído: '+(f?f.n:'alimento'),true);return;
  }
  if(a==='addcalc'){
    const m=S.meals.find(x=>x.id===$('#cm').value);
    if(!m||!(calcSel.g>0)){toast('Informe a quantidade e a refeição',false);return}
    snapshot();m.items.push({id:uid(),f:calcSel.id,g:calcSel.g});save();
    toast('Adicionado a '+m.nome,true);return;
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='sq'){refreshSheet();return}
  if(e.target.dataset&&e.target.dataset.act==='phslide'){phSlide(e.target);return}
  if(curTab()==='meta')onMetaInput(e);
  else if(curTab()==='calcular')onCalcInput(e);
});

document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(splitChange(t,a))return;
  if(featureChange(t,a))return;
  if(a==='grams'){
    const{m:mm,it}=findItem(t),n=num(t.value);
    let moved=[];
    if(it&&n>0&&n<=3000){
      snapshot();const before=sumItems(mm.items).k;
      it.g=Math.round(n*10)/10;
      if(S.profile.autoBal!==false&&mm.items.length>1)moved=compensate(mm,it,before);
      save();
      if(moved.length){render();toast('Ajustei '+moved.slice(0,3).join(', ')+'. A refeição ficou com '+fmt(sumItems(mm.items).k)+' kcal (antes '+fmt(before)+')',true);return}
    }
    render();return;
  }
  const m=S.meals.find(x=>x.id===(t.closest('[data-m]')||{dataset:{}}).dataset.m);if(!m)return;
  if(a==='rename'){m.nome=t.value.trim()||m.nome;t.value=m.nome;save()}
  if(a==='time'){m.hora=t.value;save()}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&document.body.classList.contains('authing')&&e.target.tagName==='INPUT'){e.preventDefault();doAuth()}
});

/* ---------- início ---------- */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
initSample();initDownloads();bindPhoto();remStart();
boot();
</script>
